<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanband Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
       <h1>Simple Kanban Board</h1>

       <div class="board">
           <!--List 1-->
         <div class="list" id="list1">
            <h2>To Do</h2>
             
            <input type="text" id="text-input" placeholder="Add Task"/>
            <button id="add-task-btn">Add Task</button>

            <div class="card" draggable="true" id="card1">Wash Dishes <button class="del-btn">Delete</button></div>
            <div class="card" draggable="true" id="card2">Buy Groceries <button class="del-btn">Delete</button></div>
         </div>

           <!--LIST 2-->
           <div class="list" id="list2">
            <h2>In Proggress</h2>
            <div class="card" draggable="true" id="card3">
               <span>Learn to Code</span>
               <button class="del-btn">Delete</button>
            </div>

            </div>

            <!--List 3-->
            <div class="list" id="list3">
            <h2>Done</h2>
            </div>
         </div>
       </div>
    </div>
     <script src="index.js"></script>
</body>
</html>
